<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>大富翁：知識征服大冒險 (多人版) v1.4.0</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@500;700;900&display=swap');
    body {
      font-family: 'Noto Sans TC', sans-serif;
      user-select: none;
    }
    
    ::-webkit-scrollbar {
      height: 8px;
      width: 8px;
    }
    ::-webkit-scrollbar-track {
      background: rgba(15, 23, 42, 0.8);
    }
    ::-webkit-scrollbar-thumb {
      background: #f59e0b;
      border-radius: 6px;
    }

    @keyframes dice-roll {
      0% { transform: rotate(0deg) scale(1); }
      50% { transform: rotate(180deg) scale(1.3); }
      100% { transform: rotate(360deg) scale(1); }
    }
    .rolling {
      animation: dice-roll 0.4s ease-in-out infinite;
    }

    /* 面對面 180 度旋轉樣式 */
    .p2-flipped {
      transform: rotate(180deg);
    }

    /* 蜿蜒街道地圖樣式 */
    .street-scroll-container {
      overflow: auto;
      touch-action: pan-x pan-y;
      -webkit-overflow-scrolling: touch;
      max-height: 52vh;
    }

    /* 蛇形網格：5列 x 7欄 蜿蜒街道設計 */
    .street-grid {
      display: grid;
      grid-template-columns: repeat(7, minmax(110px, 1fr));
      grid-template-rows: repeat(5, minmax(105px, 1fr));
      gap: 12px;
      min-width: 820px;
      padding: 16px;
      background: radial-gradient(circle at center, #1e293b 0%, #0f172a 100%);
      border-radius: 1.5rem;
    }

    .road-tile {
      background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
      position: relative;
      transition: all 0.2s ease;
      border-bottom-width: 8px !important;
      box-shadow: 0 8px 0 0 rgba(15, 23, 42, 0.7);
    }
    .road-tile:active {
      transform: translateY(4px);
      border-bottom-width: 4px !important;
      box-shadow: 0 4px 0 0 rgba(15, 23, 42, 0.7);
    }
    .road-tile::after {
      content: '';
      position: absolute;
      inset: 3px;
      border: 2px dashed rgba(245, 158, 11, 0.25);
      pointer-events: none;
      border-radius: 0.75rem;
    }
  </style>
</head>
<body class="bg-slate-900 text-white min-h-screen flex flex-col justify-between p-2 md:p-4 selection:bg-amber-500 selection:text-slate-900">

  <!-- 頂部線上連線資訊與功能列 -->
  <header class="max-w-7xl mx-auto w-full flex flex-wrap items-center justify-between bg-slate-800/80 backdrop-blur border border-slate-700 px-4 py-2.5 rounded-2xl mb-2 gap-2 shadow-lg relative">
    <div class="flex items-center gap-3">
      <span class="text-amber-400 font-black text-lg flex items-center gap-2">
        <i class="fa-solid fa-atom text-xl animate-spin"></i> 知識征服大冒險 <span class="text-xs bg-amber-500 text-slate-900 px-2 py-0.5 rounded-full font-bold">v1.4.0</span>
      </span>
      <span id="room-badge" class="bg-slate-700 text-slate-300 px-3 py-1 rounded-xl text-xs sm:text-sm font-bold flex items-center gap-1.5 border border-slate-600">
        <i class="fa-solid fa-plug text-yellow-400"></i> <span id="room-status-text">連線準備中...</span>
      </span>
    </div>
    <div class="flex items-center gap-2">
      <button onclick="toggleTopCardFlip()" id="flip-view-btn" class="bg-slate-700 hover:bg-slate-600 text-slate-200 text-xs sm:text-sm font-bold px-3 py-1.5 rounded-xl border border-slate-600 transition-all active:scale-95 flex items-center gap-1.5">
        <i class="fa-solid fa-rotate"></i> 翻轉頂部視角
      </button>
      <button onclick="openLobbyModal()" class="bg-indigo-600 hover:bg-indigo-500 text-white text-xs sm:text-sm font-black px-3.5 py-1.5 rounded-xl shadow transition-all active:scale-95 flex items-center gap-1.5">
        <i class="fa-solid fa-network-wired"></i> 大廳 / 切換房間
      </button>
    </div>
  </header>

  <main class="max-w-7xl mx-auto w-full flex-1 flex flex-col justify-between gap-3">
    
    <!-- 🏆 頂部計分板 (最高 8 人) -->
    <div id="leaderboard-container" class="bg-slate-800/80 p-2 md:p-3 rounded-2xl border-2 border-slate-700 shadow-xl flex gap-2 md:gap-4 overflow-x-auto custom-scrollbar items-center justify-start md:justify-center">
      <!-- Generated dynamically in updateUI -->
    </div>

    <!-- 🎲 中央街道與立體棋盤區域 -->
    <div class="flex gap-2 relative my-auto">
      <!-- 左側樓層指示高塔 -->
      <div class="hidden md:flex flex-col justify-end w-12 shrink-0 bg-slate-800/90 rounded-2xl border-4 border-slate-700 p-1 shadow-xl">
        <div class="text-slate-400 text-[10px] font-bold text-center mb-1">樓層塔</div>
        <div id="tower-floors" class="flex flex-col-reverse gap-1">
          <!-- JS dynamic floors -->
        </div>
      </div>
      
      <!-- 棋盤本體 -->
      <div class="flex-1 bg-slate-800/90 p-2 md:p-4 rounded-3xl shadow-2xl border-4 border-slate-700 relative">
        <div class="flex justify-between items-center mb-1">
          <div class="text-xs md:text-sm text-amber-400 font-black flex items-center gap-2">
            <i class="fa-solid fa-arrows-up-down-left-right"></i> 立體學院街道（自由滑動）
          </div>
          <div class="text-xs md:text-sm font-black text-cyan-300" id="current-floor-label">目前觀看: 1 樓</div>
        </div>
        
        <div class="street-scroll-container">
          <div id="board" class="street-grid relative">
            <!-- 蜿蜒街道格與中央畫面由 JavaScript 動態生成 -->
          </div>
        </div>
      </div>
    </div>

    <!-- 🔻 玩家控制面板 -->
    <div id="control-panel-container" class="bg-slate-800 p-3 md:p-4 rounded-2xl border-4 shadow-2xl transition-all duration-300">
      <div class="flex flex-col md:flex-row justify-between items-center gap-4">
        <div class="flex items-center gap-4">
          <div id="current-player-avatar" onclick="openAvatarModal(myPlayerIndex)" title="點擊自訂頭像" class="w-12 h-12 rounded-full flex items-center justify-center text-2xl shadow-lg border-2 border-white overflow-hidden cursor-pointer relative group">

          </div>
          <div>
            <div class="font-black text-xl md:text-2xl flex items-center gap-2 text-white">
              <span id="current-player-name">輪到玩家</span>

            </div>
            <div class="text-sm md:text-base text-slate-300 font-bold" id="current-player-status">準備行動...</div>

        </div>

        <div class="flex items-center gap-3 w-full md:w-auto justify-end flex-wrap">
          <button onclick="openItemShop()" class="bg-indigo-600 hover:bg-indigo-500 text-white text-sm md:text-base font-black py-2.5 px-4 rounded-xl transition-all shadow-lg flex items-center gap-2 active:scale-95">

  </main>

  <!-- 🌐 線上對戰房間大廳 Modal -->

    <div class="bg-slate-800 border-4 border-amber-500/80 rounded-3xl p-6 sm:p-8 max-w-lg w-full shadow-2xl text-white relative">

                <option value="3">3 人</option>
                <option value="4">4 人</option>
                <option value="5">5 人</option>
                <option value="6">6 人</option>

          </div>

          <button onclick="createOnlineRoom()" class="w-full bg-gradient-to-r from-amber-500 to-amber-600 hover:from-amber-400 hover:to-amber-500 text-slate-900 font-black py-3 rounded-xl text-base shadow-lg transition-all active:scale-95">

        </div>

        <!-- 加入房間區 -->
        <div class="bg-slate-900 p-4 rounded-2xl border border-slate-700">
          <h3 class="font-black text-blue-400 text-lg mb-2 text-center"><i class="fa-solid fa-right-to-bracket"></i> 加入既有房間</h3>
          <div class="flex gap-2">
            <input type="text" id="join-room-input" placeholder="輸入 6 位數房間號碼" class="flex-1 bg-slate-800 border-2 border-slate-600 rounded-xl px-3 py-2 text-white font-black text-center text-lg focus:border-blue-400 focus:outline-none uppercase">
            <button onclick="joinOnlineRoom()" class="bg-blue-600 hover:bg-blue-500 text-white font-black px-5 py-2 rounded-xl text-base shadow-lg transition-all active:scale-95">
              加入 🎮
            </button>
          </div>
        </div>
      </div>

    </div>
  </div>

  <!-- 房間等待對手 Modal -->

    <div class="bg-slate-800 border-4 border-amber-500 rounded-3xl p-6 sm:p-8 max-w-md w-full shadow-2xl text-center text-white">
      <div class="text-5xl text-amber-400 mb-3 animate-bounce"><i class="fa-solid fa-hourglass-half"></i></div>
      <h3 class="text-2xl font-black mb-2">等待對手加入...</h3>
      <p class="text-slate-300 text-sm mb-4">請將下方房間號碼分享給對手：</p>

      <div class="bg-slate-900 border-2 border-amber-400/60 p-4 rounded-2xl mb-4 flex items-center justify-between">
        <span id="waiting-room-code" class="text-3xl font-black text-amber-300 tracking-widest font-mono">------</span>
        <button onclick="copyRoomCode()" class="bg-amber-500 hover:bg-amber-400 text-slate-900 font-bold px-3 py-2 rounded-xl text-xs flex items-center gap-1 active:scale-95">
          <i class="fa-solid fa-copy"></i> 複製房號
        </button>
      </div>

      <div id="copy-toast" class="hidden text-xs text-emerald-400 font-bold mb-3">已複製房號至剪貼簿！</div>

      <button onclick="leaveRoomAndReset()" class="bg-slate-700 hover:bg-slate-600 text-slate-300 font-bold py-2 px-5 rounded-xl text-sm transition-all">
        取消並離開房間
      </button>
    </div>
  </div>

  <!-- 彈窗 Modal: 對決動態訊息卡 -->
  <div id="modal" class="fixed inset-0 bg-black/40 backdrop-blur-[2px] hidden flex flex-col justify-center items-center p-3 sm:p-6 z-50 overflow-y-auto">
    <!-- SVG 連接線畫布 -->
    <svg id="modal-svg-canvas" class="fixed inset-0 w-full h-full pointer-events-none z-[-1]"></svg>
    <div class="w-full max-w-md my-auto flex flex-col gap-4 py-2">
      
      <!-- 單一視角卡片 -->
      <div id="modal-card-main" class="bg-slate-800 border-4 border-amber-500/70 rounded-3xl p-4 sm:p-6 text-center shadow-[0_0_40px_rgba(245,158,11,0.3)] transition-transform hover:scale-[1.02]">
        <div id="modal-icon-main" class="text-4xl sm:text-5xl mb-3 text-amber-400">
          <i class="fa-solid fa-circle-info"></i>
        </div>
        <h3 id="modal-title-main" class="text-xl sm:text-2xl font-black mb-2 text-white">訊息標題</h3>
        <div id="modal-desc-main" class="text-slate-100 text-sm sm:text-base font-bold mb-4 leading-relaxed">訊息內容...</div>
        <div id="modal-actions-main" class="flex flex-col sm:flex-row flex-wrap gap-3 justify-center"></div>
      </div>

    </div>
  </div>

  <!-- 🎨 頭像與角色編輯 Modal -->
  <div id="avatar-modal" class="fixed inset-0 bg-black/85 backdrop-blur-md hidden flex items-center justify-center p-4 z-50 overflow-y-auto">
    <div class="bg-slate-800 border-4 border-amber-500/80 rounded-3xl p-5 sm:p-7 max-w-lg w-full shadow-2xl text-white relative">
      <div class="flex justify-between items-center mb-4 border-b border-slate-700 pb-3">
        <h3 class="text-xl sm:text-2xl font-black text-amber-400 flex items-center gap-2">
          <i class="fa-solid fa-user-gear"></i> 自訂玩家頭像與設定
        </h3>
        <button onclick="closeAvatarModal()" class="text-slate-400 hover:text-white text-xl font-bold p-1"><i class="fa-solid fa-xmark"></i></button>
      </div>

      <div class="space-y-4">
        <div class="flex flex-col items-center bg-slate-900 border border-slate-700 rounded-2xl p-4">
          <div id="avatar-preview-box" class="w-20 h-20 rounded-full bg-red-500 flex items-center justify-center text-4xl border-4 border-white shadow-xl overflow-hidden mb-2">
            <i class="fa-solid fa-user-ninja text-white"></i>
          </div>
          <div id="avatar-preview-name" class="font-black text-lg text-white">玩家 1 (紅)</div>
        </div>

        <label class="block">
          <span class="text-sm font-black text-slate-300">玩家名稱</span>
          <input id="avatar-input-name" oninput="updateAvatarPreview()" maxlength="16" class="mt-1 w-full bg-slate-900 border-2 border-slate-600 rounded-xl px-3 py-2 text-white font-bold focus:border-amber-400 focus:outline-none" placeholder="輸入玩家名稱">
        </label>

        <div class="flex gap-2 bg-slate-900 border border-slate-700 rounded-2xl p-1">
          <button id="tab-btn-icon" onclick="switchAvatarTab('icon')" class="flex-1 py-2 px-3 rounded-xl font-bold text-sm bg-amber-500 text-slate-900 border-2 border-amber-400">圖示</button>
          <button id="tab-btn-image" onclick="switchAvatarTab('image')" class="flex-1 py-2 px-3 rounded-xl font-bold text-sm bg-slate-700 text-slate-300 border-2 border-slate-600">圖片</button>
        </div>

        <div id="avatar-tab-icon" class="space-y-3">
          <div>
            <div class="text-sm font-black text-slate-300 mb-2">角色圖示</div>
            <div class="grid grid-cols-5 gap-2">
              <button onclick="selectAvatarIcon('fa-user-ninja')" class="bg-slate-700 hover:bg-slate-600 rounded-xl p-3 text-xl border border-slate-600"><i class="fa-solid fa-user-ninja"></i></button>
              <button onclick="selectAvatarIcon('fa-user-astronaut')" class="bg-slate-700 hover:bg-slate-600 rounded-xl p-3 text-xl border border-slate-600"><i class="fa-solid fa-user-astronaut"></i></button>
              <button onclick="selectAvatarIcon('fa-robot')" class="bg-slate-700 hover:bg-slate-600 rounded-xl p-3 text-xl border border-slate-600"><i class="fa-solid fa-robot"></i></button>
              <button onclick="selectAvatarIcon('fa-flask')" class="bg-slate-700 hover:bg-slate-600 rounded-xl p-3 text-xl border border-slate-600"><i class="fa-solid fa-flask"></i></button>
              <button onclick="selectAvatarIcon('fa-bolt')" class="bg-slate-700 hover:bg-slate-600 rounded-xl p-3 text-xl border border-slate-600"><i class="fa-solid fa-bolt"></i></button>
            </div>
          </div>

          <div>
            <div class="text-sm font-black text-slate-300 mb-2">代表顏色</div>
            <div class="grid grid-cols-6 gap-2">
              <button onclick="selectAvatarColor('bg-red-500')" class="h-10 rounded-xl bg-red-500 border-2 border-white/70" title="紅色"></button>
              <button onclick="selectAvatarColor('bg-blue-500')" class="h-10 rounded-xl bg-blue-500 border-2 border-white/70" title="藍色"></button>
              <button onclick="selectAvatarColor('bg-emerald-500')" class="h-10 rounded-xl bg-emerald-500 border-2 border-white/70" title="綠色"></button>
              <button onclick="selectAvatarColor('bg-amber-500')" class="h-10 rounded-xl bg-amber-500 border-2 border-white/70" title="黃色"></button>
              <button onclick="selectAvatarColor('bg-fuchsia-500')" class="h-10 rounded-xl bg-fuchsia-500 border-2 border-white/70" title="紫紅色"></button>
              <button onclick="selectAvatarColor('bg-cyan-500')" class="h-10 rounded-xl bg-cyan-500 border-2 border-white/70" title="青色"></button>
            </div>
          </div>
        </div>

        <div id="avatar-tab-image" class="hidden space-y-3">
          <label class="block">
            <span class="text-sm font-black text-slate-300">上傳圖片</span>
            <input id="avatar-file-input" type="file" accept="image/*" onchange="handleAvatarFileUpload(event)" class="mt-1 w-full text-sm text-slate-300 file:mr-3 file:rounded-xl file:border-0 file:bg-amber-500 file:px-3 file:py-2 file:font-black file:text-slate-900">
          </label>
          <label class="block">
            <span class="text-sm font-black text-slate-300">或貼上圖片網址</span>
            <input id="avatar-url-input" oninput="handleAvatarUrlInput(event)" class="mt-1 w-full bg-slate-900 border-2 border-slate-600 rounded-xl px-3 py-2 text-white font-bold focus:border-amber-400 focus:outline-none" placeholder="https://...">
          </label>
        </div>

        <div class="flex gap-3 pt-2">
          <button onclick="saveAvatarSettings()" class="flex-1 bg-amber-500 hover:bg-amber-400 text-slate-900 font-black py-3 rounded-xl shadow-lg active:scale-95">
            儲存設定
          </button>
          <button onclick="closeAvatarModal()" class="bg-slate-700 hover:bg-slate-600 text-white font-bold py-3 px-5 rounded-xl active:scale-95">
            取消
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- 🌐 引入 PeerJS 免伺服器 P2P 直連套件 -->
  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
  <script src="assets/js/game-data.js"></script>
  <script src="assets/js/quiz-system.js"></script>

  <!-- 🎮 遊戲核心與 P2P 線上連線邏輯 -->
  <script>
    let peer = null;
    let peerConn = null;
    let currentRoomId = null;
    let myPlayerIndex = 0; // 0: 玩家1(紅Host), 1: 玩家2(藍Guest)
    let isOnlineMode = true;
    let isTopFlipped = false;
    let connectionTimeoutTimer = null;
    let isConnected = false;
    let currentFloorView = 1;

    // Google 公用 STUN 伺服器設定，大幅提高 P2P NAT 穿透與行動網路連線成功率
    const peerConfig = {
      config: {
        iceServers: [
          { urls: 'stun:stun.l.google.com:19302' },
          { urls: 'stun:stun1.l.google.com:19302' },
          { urls: 'stun:stun2.l.google.com:19302' },
          { urls: 'stun:stun3.l.google.com:19302' }
        ]
      }
    };

    let hostConnections = [];
    let isHost = false;

    // 建立免費 P2P 直連房間
    window.createOnlineRoom = function() {
      const randomCode = Math.floor(100000 + Math.random() * 900000).toString();
      currentRoomId = randomCode;
      
      const maxPlayersSelect = document.getElementById("lobby-max-players");
      maxPlayers = maxPlayersSelect ? parseInt(maxPlayersSelect.value, 10) : 2;
      players = players.slice(0, maxPlayers);
      
      myPlayerIndex = 0; // Host 玩家 1
      isOnlineMode = true;
      isConnected = false;
      isHost = true;
      hostConnections = [];

      const peerId = 'phy-mono-' + currentRoomId;

      if (peer) peer.destroy();
      peer = new Peer(peerId, peerConfig);

      updateUI();

      peer.on('open', (id) => {
        addLog(`🌐 房間建立成功！上限 ${maxPlayers} 人。房號：${currentRoomId}`, "text-emerald-400 font-bold");
        document.getElementById("lobby-modal").classList.add("hidden");
        document.getElementById("waiting-room-code").innerText = currentRoomId;
        document.getElementById("waiting-modal").classList.remove("hidden");
        updateUI();
      });

      peer.on('connection', (conn) => {
        if (hostConnections.length + 1 >= maxPlayers) {
          conn.on('open', () => conn.send({ type: 'ERROR', msg: '房間已滿！' }));
          setTimeout(() => conn.close(), 1000);
          return;
        }

        conn.on('open', () => {
          isConnected = true;
          const assignedId = hostConnections.length + 1;
          conn.playerId = assignedId;
          hostConnections.push(conn);
          
          setupConnectionListeners(conn, true);
          conn.send({ type: 'ASSIGN_ID', id: assignedId, maxPlayers: maxPlayers, quizWeights: quizWeights });
          
          document.getElementById("waiting-modal").classList.add("hidden");
          addLog(`🎉 ${players[assignedId].name} 加入房間！`, "text-emerald-300 font-black");
          
          updateUI();
          syncGameStateToPeer(); // Broadcast to all
        });
      });

      peer.on('error', (err) => {
        console.error("PeerJS Host Error:", err);
        showModal("fa-triangle-exclamation text-rose-400", "建立連線失敗", "可能該房號已被佔用或網路不穩定，請重新嘗試！", false);
        updateUI();
      });
    };

    // 加入既有 P2P 房間
    window.joinOnlineRoom = function(evt) {
      const inputEl = document.getElementById("join-room-input");
      const codeInput = inputEl ? inputEl.value.trim() : "";
      if (!codeInput || codeInput.length !== 6) {
        showModal("fa-triangle-exclamation text-amber-400", "請輸入 6 位數房號", "請檢查房號格式是否正確！", false);
        return;
      }

      const joinBtn = (evt && evt.currentTarget) ? evt.currentTarget : document.querySelector("button[onclick*='joinOnlineRoom']");
      if (joinBtn) {
        joinBtn.disabled = true;
        joinBtn.innerHTML = '<i class="fa-solid fa-spinner animate-spin"></i> 連線中...';
      }

      currentRoomId = codeInput;
      isOnlineMode = true;
      isConnected = false;
      isHost = false;
      myPlayerIndex = -1; // Wait for host to assign

      if (connectionTimeoutTimer) clearTimeout(connectionTimeoutTimer);

      if (peer) peer.destroy();
      peer = new Peer(peerConfig);

      updateUI();

      // 設定 12 秒連線逾時防護機制
      connectionTimeoutTimer = setTimeout(() => {
        if (!isConnected) {
          if (peerConn) peerConn.close();
          if (joinBtn) {
            joinBtn.disabled = false;
            joinBtn.innerHTML = '加入 🎮';
          }
          showModal("fa-circle-xmark text-rose-400", "連線逾時", `無法連線至房號 ${currentRoomId}。<br>請確認房號是否正確，且房主仍在房間中等待！`, false);
          updateUI();
        }
      }, 12000);

      peer.on('open', () => {
        const targetPeerId = 'phy-mono-' + currentRoomId;
        peerConn = peer.connect(targetPeerId, { reliable: true });

        peerConn.on('open', () => {
          if (connectionTimeoutTimer) clearTimeout(connectionTimeoutTimer);
          isConnected = true;
          if (joinBtn) {
            joinBtn.disabled = false;
            joinBtn.innerHTML = '加入 🎮';
          }
          setupConnectionListeners(peerConn, false);
          document.getElementById("lobby-modal").classList.add("hidden");
          document.getElementById("waiting-modal").classList.add("hidden");
          addLog(`🎮 已連線至房號 ${currentRoomId}！等待主機同步狀態...`, "text-emerald-400 font-bold");
        });

        peerConn.on('error', (err) => {
          if (connectionTimeoutTimer) clearTimeout(connectionTimeoutTimer);
          if (joinBtn) {
            joinBtn.disabled = false;
            joinBtn.innerHTML = '加入 🎮';
          }
          showModal("fa-circle-xmark text-rose-400", "找不到房間", "連線失敗！請確認房號是否正確或房間是否開啟。", false);
          updateUI();
        });
      });

      peer.on('error', (err) => {
        console.error("PeerJS Guest Error:", err);
        if (connectionTimeoutTimer) clearTimeout(connectionTimeoutTimer);
        if (joinBtn) {
          joinBtn.disabled = false;
          joinBtn.innerHTML = '加入 🎮';
        }
        showModal("fa-circle-xmark text-rose-400", "連線失敗", "無法建立 P2P 直連，請檢查網路連線或重試。", false);
        updateUI();
      });
    };

    // 設定 P2P 訊息監聽與雙向資料同步
    function setupConnectionListeners(conn, isHostSide) {
      if (!conn) return;

      conn.on('data', (data) => {
        if (data.type === 'ASSIGN_ID') {
           myPlayerIndex = data.id;
           maxPlayers = data.maxPlayers;
           players = players.slice(0, maxPlayers);
           quizWeights = data.quizWeights;
           updateUI();
        } else if (data.type === 'SYNC_STATE') {
          players = data.players;
          allFloorTiles = data.allFloorTiles;
          boardTiles = allFloorTiles[currentFloorView];
          currentPlayerIndex = data.currentPlayerIndex;
          isConnected = true;
          updateUI();
          renderPlayers();
          if (isHostSide) {
             // Broadcast to other guests
             hostConnections.forEach(c => {
                if (c !== conn && c.open) c.send(data);
             });
          }
        } else if (data.type === 'LOG') {
          addLog(data.msg, data.colorClass, true);
          if (isHostSide) {
             hostConnections.forEach(c => {
                if (c !== conn && c.open) c.send(data);
             });
          }
        } else if (data.type === 'ERROR') {
          showModal("fa-circle-xmark text-rose-400", "連線失敗", data.msg, false);
        }
      });

      conn.on('close', () => {
        if (isHostSide) {
           addLog(`⚠️ 玩家連線中斷！`, "text-rose-400 font-bold");
           hostConnections = hostConnections.filter(c => c !== conn);
        } else {
           isConnected = false;
           showModal("fa-plug-circle-xmark text-rose-400", "主機已離線", "房主已斷開連線。", false);
        }
        updateUI();
      });
    }

    // 將最新遊戲狀態同步給對方
    function syncGameStateToPeer() {
      if (!isOnlineMode) return;
      const state = {
        type: 'SYNC_STATE',
        players: players,
        allFloorTiles: allFloorTiles,
        currentPlayerIndex: currentPlayerIndex
      };
      
      if (isHost) {
        hostConnections.forEach(conn => {
          if (conn.open) conn.send(state);
        });
      } else {
        if (peerConn && peerConn.open) {
          peerConn.send(state);
        }
      }
    }

    window.copyRoomCode = function() {
      if (!currentRoomId) return;
      navigator.clipboard ? navigator.clipboard.writeText(currentRoomId) : document.execCommand('copy');
      const toast = document.getElementById("copy-toast");
      if (toast) {
        toast.classList.remove("hidden");
        setTimeout(() => toast.classList.add("hidden"), 2000);
      }
    };

    window.openLobbyModal = async function() {
      // Show the modal immediately with loading state
      document.getElementById("lobby-modal").classList.remove("hidden");
      
      const weightsContainer = document.getElementById("lobby-quiz-weights");
      
      // Attempt to wait for quizzes with a 1.5s timeout
      if (window.quizzesReady) {
        try {
          await Promise.race([
            window.quizzesReady,
            new Promise((_, reject) => setTimeout(() => reject(new Error("Timeout")), 1500))
          ]);
        } catch (e) {
          console.warn("題庫載入超時或失敗，將使用預設設定。", e);
        }
      }
      
      // Fallback titles if uniqueQuizTitles is missing
      const titles = window.uniqueQuizTitles && window.uniqueQuizTitles.length > 0 
                     ? window.uniqueQuizTitles 
                     : ["槓桿原理挑戰", "滑輪省力挑戰", "輪軸傳動挑戰", "齒輪咬合挑戰", "斜面省力挑戰"];
      
      if (weightsContainer) {
        weightsContainer.innerHTML = "";
        titles.forEach(title => {
          const defaultWeight = 100 / titles.length;
          const currentWeight = (quizWeights && typeof quizWeights[title] !== 'undefined') ? quizWeights[title] : defaultWeight;
          
          if (quizWeights) {
            quizWeights[title] = currentWeight;
          }

          const row = document.createElement("div");
          row.className = "flex items-center justify-between gap-2";
          row.innerHTML = `
            <span class="text-sm font-bold text-slate-300 w-1/3 truncate" title="${title}">${title}</span>
            <input type="range" min="0" max="100" value="${currentWeight}" class="flex-1 accent-amber-500" onchange="window.updateQuizWeight('${title}', this.value)">
            <span class="text-sm font-black text-amber-400 w-8 text-right" id="weight-val-${title}">${Math.round(currentWeight)}%</span>
          `;
          weightsContainer.appendChild(row);
        });
      }
    };

    window.updateQuizWeight = function(title, val) {
      quizWeights[title] = Number(val);
      const span = document.getElementById(`weight-val-${title}`);
      if (span) span.innerText = val + "%";
    };

    window.leaveRoomAndReset = function() {
      if (peer) {
        peer.destroy();
        peer = null;
      }
      peerConn = null;
      currentRoomId = null;
      isOnlineMode = false;
      isConnected = false;
      document.getElementById("waiting-modal").classList.add("hidden");
      document.getElementById("lobby-modal").classList.remove("hidden");
      updateUI();
    };

    window.toggleTopCardFlip = function() {
      isTopFlipped = !isTopFlipped;
      const card = document.getElementById("p1-card-container");
      if (card) {
        if (isTopFlipped) card.classList.add("p2-flipped");
        else card.classList.remove("p2-flipped");
      }
    };

    function getAvatarInnerHTML(p) {
      if (p.avatarType === 'image' && p.customAvatar) {
        return `<img src="${p.customAvatar}" class="w-full h-full object-cover rounded-full pointer-events-none" alt="avatar" onerror="this.onerror=null; this.src='https://placehold.co/100x100/1e293b/f59e0b?text=User';">`;
      } else if (p.icon && p.icon.startsWith('fa-')) {
        return `<i class="fa-solid ${p.icon} text-white"></i>`;
      } else {
        return `<span class="text-white font-bold">${p.icon || '👤'}</span>`;
      }
    }

    function initBoard() {
      const board = document.getElementById("board");
      if (!board) return;
      board.innerHTML = "";

      for (let f = 1; f <= 6; f++) {
        allFloorTiles[f].forEach(tileData => {
          const tileEl = document.createElement("div");
          tileEl.id = `tile-${f}-${tileData.id}`;
          tileEl.dataset.floor = f;
          tileEl.style.gridRowStart = tileData.pos[0] + 1;
          tileEl.style.gridColumnStart = tileData.pos[1] + 1;
          
          let initialBaseStyle = "road-tile relative flex flex-col justify-between p-2.5 rounded-2xl border-2 border-slate-600 bg-slate-800/90 shadow-md transition-all min-h-0 min-w-0";
          if (tileData.type === "start") initialBaseStyle = "road-tile relative flex flex-col justify-between p-2.5 rounded-2xl border-4 border-emerald-400 bg-emerald-950/90 shadow-lg shadow-emerald-950/50 transition-all min-h-0 min-w-0 text-emerald-300";
          if (tileData.type === "physics") initialBaseStyle = "road-tile relative flex flex-col justify-between p-2.5 rounded-2xl border-4 border-amber-400 bg-amber-950/90 shadow-lg shadow-amber-950/50 transition-all min-h-0 min-w-0 text-amber-300";
          if (tileData.type === "chance" || tileData.type === "fate") initialBaseStyle = "road-tile relative flex flex-col justify-between p-2.5 rounded-2xl border-4 border-indigo-400 bg-indigo-950/90 shadow-lg shadow-indigo-950/50 transition-all min-h-0 min-w-0 text-indigo-300";
          if (tileData.type === "tax") initialBaseStyle = "road-tile relative flex flex-col justify-between p-2.5 rounded-2xl border-4 border-rose-400 bg-rose-950/90 shadow-lg shadow-rose-950/50 transition-all min-h-0 min-w-0 text-rose-300";
          if (tileData.type === "corner") initialBaseStyle = "road-tile relative flex items-center justify-center p-2.5 rounded-2xl border-4 border-slate-500 bg-slate-800/50 shadow-inner transition-all min-h-0 min-w-0 text-slate-400";

          if (f !== currentFloorView) initialBaseStyle += " hidden";

          tileEl.className = initialBaseStyle;
          
          let tileContent = "";
          
          if (tileData.type === "corner") {
            tileContent = `<div class="text-4xl sm:text-5xl my-auto text-center opacity-70"><i class="fa-solid ${tileData.icon}"></i></div>`;
          } else {
            tileContent = `
              <div class="flex items-start justify-between gap-1 w-full">
                <span class="truncate text-sm sm:text-base font-black text-white leading-tight">${tileData.name}</span>
                <span id="tile-badge-${f}-${tileData.id}" class="shrink-0"></span>
              </div>
            `;
            
            if (tileData.type === "property") {
              tileContent += `
                <div class="flex items-center justify-between my-auto w-full pt-1">
                  <span class="text-sm sm:text-base font-black text-amber-300" id="tile-price-${f}-${tileData.id}">$${tileData.price}</span>
                  <span class="flex gap-0.5 text-sm text-amber-400" id="tile-houses-${f}-${tileData.id}"></span>
                </div>
              `;
            } else if (tileData.icon) {
              tileContent += `<div class="text-2xl sm:text-3xl my-auto text-center opacity-90"><i class="fa-solid ${tileData.icon}"></i></div>`;
            }
          }

          let directionHTML = "";
          const tiles = allFloorTiles[f];
          const currentIndex = tiles.findIndex(t => t.id === tileData.id);
          if (currentIndex !== -1 && currentIndex < tiles.length - 1) {
            const nextTile = tiles[currentIndex + 1];
            const dy = nextTile.pos[0] - tileData.pos[0];
            const dx = nextTile.pos[1] - tileData.pos[1];
            
            let arrowClass = "";
            let arrowIcon = "fa-chevron-right";
            
            if (dx > 0 && dy === 0) {
              arrowClass = "-right-5 top-1/2 -translate-y-1/2";
              arrowIcon = dx > 1 ? "fa-angles-right text-amber-500/80 drop-shadow-lg scale-150 z-20" : "fa-chevron-right";
            } else if (dx < 0 && dy === 0) {
              arrowClass = "-left-5 top-1/2 -translate-y-1/2";
              arrowIcon = dx < -1 ? "fa-angles-left text-amber-500/80 drop-shadow-lg scale-150 z-20" : "fa-chevron-left";
            } else if (dy > 0 && dx === 0) {
              arrowClass = "-bottom-5 left-1/2 -translate-x-1/2";
              arrowIcon = dy > 1 ? "fa-angles-down text-amber-500/80 drop-shadow-lg scale-150 z-20" : "fa-chevron-down";
            } else if (dy < 0 && dx === 0) {
              arrowClass = "-top-5 left-1/2 -translate-x-1/2";
              arrowIcon = dy < -1 ? "fa-angles-up text-amber-500/80 drop-shadow-lg scale-150 z-20" : "fa-chevron-up";
            }

            if (arrowClass) {
              directionHTML = `<div class="absolute ${arrowClass} text-slate-500/90 text-lg z-0 pointer-events-none drop-shadow-sm"><i class="fa-solid ${arrowIcon}"></i></div>`;
            }
          }

          tileContent += directionHTML;
          tileContent += `<div id="piece-container-${f}-${tileData.id}" class="absolute bottom-1 left-1/2 -translate-x-1/2 flex gap-1 z-10"></div>`;

          tileEl.innerHTML = tileContent;
          board.appendChild(tileEl);
        });
      }

      const centerArea = document.createElement("div");
      centerArea.style.gridRow = "2 / 4";
      centerArea.style.gridColumn = "2 / 6";
      centerArea.className = "bg-slate-950/95 rounded-2xl flex flex-col p-3 border-4 border-slate-700 shadow-2xl justify-between overflow-hidden relative z-0 h-full min-h-0 min-w-0 gap-2";
      centerArea.innerHTML = `
        <div class="flex-1 flex flex-col overflow-hidden min-h-0 bg-slate-900/80 rounded-xl border border-slate-700 p-2">
          <div class="flex items-center justify-between text-xs sm:text-sm font-black text-emerald-400 mb-1 border-b border-slate-700 pb-1">
            <span><i class="fa-solid fa-satellite-dish"></i> 遊戲動態看板</span>
          </div>
          <div class="relative flex-1 min-h-0 mt-1">
            <div id="game-log-main" class="absolute inset-0 overflow-y-auto text-xs sm:text-sm font-bold space-y-1 text-left font-sans pr-1 leading-snug">
              <div class="text-slate-400">🎮 歡迎來到立體學院大富翁！</div>
            </div>
          </div>
        </div>
        <div class="flex flex-col items-center justify-center gap-2 py-2 shrink-0">
          <div id="turn-indicator-main" class="text-xs sm:text-sm font-black text-amber-300 bg-amber-900/40 px-3 py-1 rounded-full border border-amber-700"></div>
          <div id="dice" class="w-16 h-16 sm:w-20 sm:h-20 bg-amber-400 text-slate-900 rounded-3xl flex items-center justify-center text-3xl sm:text-4xl font-black shadow-xl cursor-pointer hover:bg-amber-300 transition-all active:scale-95 border-b-4 border-amber-600" onclick="rollDice()">
            <i id="dice-icon" class="fa-solid fa-dice-d20"></i>
          </div>
        </div>
      `;
      board.appendChild(centerArea);

      renderPlayers();
      updateUI();
    }

    function renderPlayers() {
      for (let f = 1; f <= 6; f++) {
        allFloorTiles[f].forEach(t => {
          const container = document.getElementById(`piece-container-${f}-${t.id}`);
          if (container) container.innerHTML = "";
        });
      }

      players.forEach(p => {
        if (p.bankrupted) return;
        if (p.floor !== currentFloorView) return; // Only render if looking at their floor
        const container = document.getElementById(`piece-container-${p.floor}-${p.position}`);
        if (container) {
          const piece = document.createElement("div");
          piece.className = `w-7 h-7 sm:w-9 sm:h-9 ${p.color} rounded-full border-2 border-white flex items-center justify-center text-xs sm:text-base shadow-2xl animate-bounce overflow-hidden`;
          piece.innerHTML = getAvatarInnerHTML(p);
          container.appendChild(piece);
        }
      });
    }

    function switchFloorView(floor) {
      if (floor < 1 || floor > 6) return;
      currentFloorView = floor;
      boardTiles = allFloorTiles[floor];
      
      const label = document.getElementById("current-floor-label");
      if (label) label.innerText = `目前觀看: ${floor} 樓`;

      for (let f = 1; f <= 6; f++) {
        allFloorTiles[f].forEach(t => {
          const tileEl = document.getElementById(`tile-${f}-${t.id}`);
          if (tileEl) {
            if (f === floor) {
              tileEl.classList.remove("hidden");
            } else {
              tileEl.classList.add("hidden");
            }
          }
        });
      }
      renderPlayers();
      updateUI();
    }

    function updateUI() {
      // 1. 更新頂部連線標籤
      const statusText = document.getElementById("room-status-text");
      if (statusText) {
        if (isOnlineMode) {
          if (isConnected) {
            statusText.innerText = `🟢 線上對戰 (房號: ${currentRoomId}) - 你是 ${players[myPlayerIndex].name}`;
          } else if (isHost) {
            statusText.innerText = `⏳ 等待對手加入 (房號: ${currentRoomId})...`;
          } else {
            statusText.innerText = `⏳ 正在連線至房號 ${currentRoomId}...`;
          }
        } else {
          statusText.innerText = "單機模式";
        }
      }

      // 2. 更新當前樓層的棋盤格 (征服領地顯示)
      allFloorTiles[currentFloorView].forEach(tile => {
        const tileEl = document.getElementById(`tile-${currentFloorView}-${tile.id}`);
        if (!tileEl) return;

        if (tile.type === "property") {
          const badgeEl = document.getElementById(`tile-badge-${currentFloorView}-${tile.id}`);
          if (tile.conqueredBy !== undefined && tile.conqueredBy !== null) {
            const p = players[tile.conqueredBy];
            tileEl.className = `road-tile relative flex flex-col justify-between p-2.5 rounded-2xl border-4 ${p.color.replace('bg-', 'border-')} ${p.color.replace('500', '950/90')} shadow-md transition-all min-h-0 min-w-0`;
            if (badgeEl) {
              badgeEl.className = `${p.color.replace('500', '600')} text-white font-black px-2 py-0.5 rounded-lg text-xs uppercase shadow-md`;
              badgeEl.innerText = p.name;
              badgeEl.classList.remove("hidden");
            }
          } else {
             tileEl.className = "road-tile relative flex flex-col justify-between p-2.5 rounded-2xl border-2 border-slate-600 bg-slate-800/90 transition-all min-h-0 min-w-0";
             if (badgeEl) {
               badgeEl.className = "hidden";
             }
          }
        }
      });

      // 3. 更新頂部計分板 Leaderboard
      const leaderboard = document.getElementById("leaderboard-container");
      if (leaderboard) {
        leaderboard.innerHTML = "";
        players.forEach(p => {
          let scoreHtml = "";
          const scoreConfigs = window.uniqueQuizTitles || ["槓桿原理", "滑輪", "輪軸", "齒輪", "斜面"];
          const colors = ['text-amber-400', 'text-blue-400', 'text-emerald-400', 'text-rose-400', 'text-purple-400', 'text-cyan-400'];
          
          scoreConfigs.forEach((title, i) => {
            if (p.scores[title]) {
              scoreHtml += `<span class="${colors[i % colors.length]} font-bold text-xs" title="${title}"><i class="fa-solid fa-star"></i> ${p.scores[title]}</span>`;
            }
          });
          
          if (!scoreHtml) scoreHtml = `<span class="text-slate-500 text-[10px] md:text-xs">無積分</span>`;
          
          const isTurn = (p.id === currentPlayerIndex) ? "border-amber-400 shadow-[0_0_10px_rgba(251,191,36,0.5)] scale-105" : "border-slate-600 opacity-60";
          
          leaderboard.innerHTML += `
            <div class="flex items-center gap-1.5 md:gap-2 bg-slate-900 rounded-xl p-1.5 pr-2 md:pr-3 border-2 ${isTurn} transition-all min-w-max">
              <div class="w-6 h-6 md:w-8 md:h-8 rounded-full ${p.color} flex items-center justify-center text-xs md:text-sm border-2 border-white">
                ${getAvatarInnerHTML(p)}
              </div>
              <div class="flex flex-col">
                <span class="text-[10px] md:text-xs font-black text-white truncate max-w-[60px] md:max-w-[80px]">${p.name}</span>
                <div class="flex gap-1">${scoreHtml}</div>
              </div>
            </div>
          `;
        });
      }

      // 4. 更新當前玩家控制面板
      const currentP = players[currentPlayerIndex];
      const avatarBox = document.getElementById("current-player-avatar");
      if (avatarBox) {
        avatarBox.className = `w-10 h-10 md:w-12 md:h-12 rounded-full ${currentP.color} flex items-center justify-center text-xl md:text-2xl shadow-lg border-2 border-white overflow-hidden relative group cursor-pointer`;
        avatarBox.innerHTML = getAvatarInnerHTML(currentP) + '<span class="absolute -bottom-1 -right-1 bg-amber-400 text-slate-900 rounded-full w-4 h-4 md:w-5 md:h-5 flex items-center justify-center text-[10px] font-bold border border-slate-800 shadow"><i class="fa-solid fa-pen"></i></span>';
        if (currentPlayerIndex === myPlayerIndex) {
          avatarBox.onclick = () => openAvatarModal(currentP.id);
        } else {
          avatarBox.onclick = null;
        }
      }
      
      const nameEl = document.getElementById("current-player-name");
      if (nameEl) nameEl.innerText = currentP.name;
      
      const statusEl = document.getElementById("current-player-status");
      if (statusEl) {
        let activeBuffs = [];
        if (currentP.activeBuffs && currentP.activeBuffs["doubleMove"]) activeBuffs.push("⚡ 雙倍衝刺");
        if (currentP.activeBuffs && currentP.activeBuffs["shield"]) activeBuffs.push("🛡️ 免退氣囊");
        statusEl.innerText = activeBuffs.length > 0 ? "狀態: " + activeBuffs.join(", ") : "準備抽題...";
      }

      const turnBadge = document.getElementById("my-turn-badge");
      if (turnBadge) turnBadge.classList.toggle("hidden", currentPlayerIndex !== myPlayerIndex);

      const panelContainer = document.getElementById("control-panel-container");
      if (panelContainer) {
        panelContainer.className = `bg-slate-800 p-3 md:p-4 rounded-2xl border-4 ${currentP.color.replace('bg-', 'border-')} shadow-2xl transition-all duration-300`;
      }
      
      const drawBtn = document.getElementById("draw-question-btn");
      if (drawBtn) {
        const canControl = (!isOnlineMode) || (currentPlayerIndex === myPlayerIndex);
        drawBtn.disabled = !canControl || isRolling; 
      }
      
      const indMain = document.getElementById("turn-indicator-main");
      if (indMain) indMain.innerHTML = `<i class="fa-solid fa-bolt text-amber-300"></i> 回合: <span class="text-emerald-400">${currentP.name}</span>`;
    }

    window.drawQuestion = function() {
      if (isRolling) return;
      const canControl = (!isOnlineMode) || (currentPlayerIndex === myPlayerIndex);
      if (!canControl) return;

      const p = players[currentPlayerIndex];
      isRolling = true;
      updateUI();
      
      // Select question by weight
      const quiz = window.getQuizByWeight ? window.getQuizByWeight() : null;
      if (!quiz) {
         isRolling = false;
         updateUI();
         return;
      }

      // Sync state indicating rolling
      syncGameStateToPeer();

      // Ensure view is scrolled to player before showing modal
      const tileEl = document.getElementById(`tile-${p.floor}-${p.position}`);
      if (tileEl) {
        tileEl.scrollIntoView({ behavior: 'smooth', block: 'center', inline: 'center' });
      }

      // Show question modal
      setTimeout(() => {
        triggerPhysicsQuiz(quiz, p, tileEl);
      }, 500); // Wait for scroll
    };
      
      if (p.bankrupted) return;

      isRolling = true;
      updateUI();

      const diceEl = document.getElementById("dice");
      const diceIcon = document.getElementById("dice-icon");
      if (diceEl) diceEl.classList.add("rolling");

      let count = 0;
      const interval = setInterval(() => {
        const randomVal = Math.floor(Math.random() * 6) + 1;
        if (diceIcon) diceIcon.className = `fa-solid ${diceIcons[randomVal - 1]}`;
        count++;
        if (count > 8) {
          clearInterval(interval);
          if (diceEl) diceEl.classList.remove("rolling");
          const diceResult = Math.floor(Math.random() * 6) + 1;
          if (diceIcon) diceIcon.className = `fa-solid ${diceIcons[diceResult - 1]}`;
          addLog(`🎲 ${p.name} 擲出了 <b>${diceResult}</b> 點！`, "text-amber-300 font-black");
          movePlayerRelative(p, diceResult);
        }
      }, 70);
    };

    function movePlayerRelative(p, steps) {
      let stepsLeft = Math.abs(steps);
      const direction = steps >= 0 ? 1 : -1;
      
      const moveInterval = setInterval(() => {
        const pFloorTiles = allFloorTiles[p.floor];
        p.position = (p.position + direction + pFloorTiles.length) % pFloorTiles.length;
        if (p.position === 0 && direction === 1) {
          addLog(`🚩 ${p.name} 經過起點！`, "text-emerald-300 font-black");
        }
        renderPlayers();
        const tileEl = document.getElementById(`tile-${p.floor}-${p.position}`);
        if (tileEl) {
          tileEl.scrollIntoView({ behavior: 'smooth', block: 'center', inline: 'center' });
        }
        
        stepsLeft--;
        if (stepsLeft <= 0) {
          clearInterval(moveInterval);
          handleTileLanding(p);
        }
      }, 300);
    }

    function handleTileLanding(p) {
      const tile = allFloorTiles[p.floor][p.position];
      addLog(`📍 ${p.name} 停留在【${tile.name}】`, "text-white font-bold");

      if (tile.type === "property") {
        if (tile.conqueredBy !== p.id) {
           tile.conqueredBy = p.id;
           addLog(`🚩 ${p.name} 征服了 ${tile.name}！`, "text-emerald-400 font-black");
        }
        finishTurn();
      } else if (tile.type === "chance" || tile.type === "fate") {
        const deck = tile.type === "chance" ? chanceCards : fateCards;
        const card = deck[Math.floor(Math.random() * deck.length)];
        showModal(tile.type === "chance" ? "fa-shuffle text-purple-400" : "fa-question text-purple-400", 
          `🎲 ${tile.name}：${card.title}`, card.desc, false, () => {
          card.action(p);
          finishTurn();
        });
      } else {
        finishTurn();
      }
    }

    window.openItemShop = function() {
      if (isRolling || (isOnlineMode && currentPlayerIndex !== myPlayerIndex)) return;
      const p = players[currentPlayerIndex];

      let shopHtml = `<div class="space-y-3 mt-2 text-left">`;
      ITEM_SHOP.forEach(item => {
         shopHtml += `
            <div class="flex items-center justify-between bg-slate-900 p-3 rounded-xl border-2 border-slate-700">
               <div class="flex items-center gap-3">
                  <div class="w-10 h-10 rounded-lg bg-indigo-500/20 text-indigo-400 flex items-center justify-center text-xl">
                     <i class="fa-solid ${item.icon}"></i>
                  </div>
                  <div>
                     <div class="font-bold text-white">${item.name}</div>
                     <div class="text-xs text-slate-400">${item.desc}</div>
                  </div>
               </div>
               <button onclick="buyItem('${item.id}', ${item.cost})" class="bg-amber-600 hover:bg-amber-500 text-white font-bold py-1.5 px-3 rounded-lg text-sm shadow">
                  ${item.cost} 積分
               </button>
            </div>
         `;
      });
      shopHtml += `</div><div class="mt-3 text-xs text-slate-400">購買道具會消耗您隨機科目中最高分的積分。</div>`;

      showModalCustomActions(
         "fa-store text-indigo-400",
         "🛒 道具商城",
         "使用答題獲得的積分來購買道具：",
         shopHtml
      );
    };

    window.buyItem = function(itemId, cost) {
       const p = players[currentPlayerIndex];
       
       let maxTitle = null;
       let maxScore = -1;
       for (const [title, score] of Object.entries(p.scores || {})) {
          if (score > maxScore) {
             maxScore = score;
             maxTitle = title;
          }
       }

       if (maxScore >= cost && maxTitle) {
          p.scores[maxTitle] -= cost;
          p.activeBuffs = p.activeBuffs || {};
          p.activeBuffs[itemId] = (p.activeBuffs[itemId] || 0) + 1;
          addLog(`🛒 ${p.name} 消耗了 ${cost} 點 ${maxTitle} 積分，購買了道具！`, "text-indigo-300 font-bold");
          
          if (itemId === "trap") {
             const others = players.filter(x => x.id !== p.id);
             const target = others[Math.floor(Math.random() * others.length)];
             addLog(`💀 陷阱觸發！隨機對手 ${target.name} 被強制倒退 1 格！`, "text-rose-400 font-black");
             movePlayerRelative(target, -1); // Wait this might interfere, let's keep it simple
             p.activeBuffs[itemId]--;
          }
          
          document.getElementById("modal").classList.add("hidden");
          syncGameStateToPeer();
          updateUI();
       } else {
          alert("積分不足！");
       }
    };

    function triggerPhysicsQuiz(quiz, p, tileEl) {
      if (isOnlineMode && myPlayerIndex !== p.id) {
        addLog(`⏳ ${p.name} 正在回答問題...`, "text-amber-300 font-bold", true);
        return;
      }

      const isMyTurnToAct = (!isOnlineMode) || (myPlayerIndex === p.id);
      const target = "main";
      const modalIcon = document.getElementById(`modal-icon-${target}`);
      const modalTitle = document.getElementById(`modal-title-${target}`);
      const modalDesc = document.getElementById(`modal-desc-${target}`);
      const actions = document.getElementById(`modal-actions-${target}`);

      if (modalIcon) {
        modalIcon.className = "text-4xl sm:text-5xl mb-3 text-amber-400";
        modalIcon.innerHTML = `<i class="fa-solid fa-brain"></i>`;
      }
      if (modalTitle) modalTitle.innerText = quiz.title;
      if (modalDesc) {
        modalDesc.innerHTML = `
          <div class="text-left bg-slate-900 p-4 rounded-2xl border-2 border-slate-700 mb-3">
            <p class="font-black text-amber-300 text-sm sm:text-base leading-snug">${quiz.question}</p>
          </div>
        `;
      }

      if (actions) {
        actions.innerHTML = "";
        if (isMyTurnToAct) {
          quiz.options.forEach((opt, idx) => {
            const btn = document.createElement("button");
            btn.className = "bg-indigo-600 hover:bg-indigo-500 text-white font-black py-3 px-4 rounded-2xl text-sm sm:text-base transition-all w-full text-left border-2 border-indigo-400 shadow-lg active:scale-95";
            btn.innerText = opt;
            btn.onclick = () => {
              if (idx === quiz.answer) {
                showModal("fa-circle-check text-emerald-400", "🎉 回答正確！", `${quiz.explanation}`, false, () => {
                  if (quiz.title) {
                    p.scores = p.scores || {};
                    p.scores[quiz.title] = (p.scores[quiz.title] || 0) + 10;
                  }
                  
                  let moveSteps = 1;
                  if (p.activeBuffs && p.activeBuffs["doubleMove"]) {
                     moveSteps = 2;
                     p.activeBuffs["doubleMove"]--;
                     if (p.activeBuffs["doubleMove"] <= 0) delete p.activeBuffs["doubleMove"];
                     addLog(`⚡ ${p.name} 觸發雙倍衝刺！`, "text-amber-300 font-bold");
                  }
                  
                  document.getElementById("modal").classList.add("hidden");
                  movePlayerRelative(p, moveSteps);
                });
              } else {
                showModal("fa-circle-xmark text-rose-400", "❌ 答錯囉！", `正確答案：${quiz.options[quiz.answer]}<br><br><span class="text-emerald-300 font-bold">${quiz.explanation}</span>`, false, () => {
                  let moveSteps = -1;
                  if (p.activeBuffs && p.activeBuffs["shield"]) {
                     moveSteps = 0;
                     p.activeBuffs["shield"]--;
                     if (p.activeBuffs["shield"] <= 0) delete p.activeBuffs["shield"];
                     addLog(`🛡️ ${p.name} 的安全氣囊抵擋了倒退懲罰！`, "text-emerald-300 font-bold");
                  }
                  document.getElementById("modal").classList.add("hidden");
                  if (moveSteps < 0) {
                     movePlayerRelative(p, moveSteps);
                  } else {
                     finishTurn();
                  }
                });
              }
            };
            actions.appendChild(btn);
          });
        }
      }

      document.getElementById("modal").classList.remove("hidden");
      if (tileEl) animateModalFromElement(tileEl.id);
    }

    function showModal(iconClass, title, desc, showConfirm, onConfirm = null, onCancel = null) {
      const modal = document.getElementById("modal");
      
      const target = "main";
      const modalIcon = document.getElementById(`modal-icon-${target}`);
      const modalTitle = document.getElementById(`modal-title-${target}`);
      const modalDesc = document.getElementById(`modal-desc-${target}`);
      const actions = document.getElementById(`modal-actions-${target}`);

      if (modalIcon) {
        modalIcon.className = `text-4xl sm:text-5xl mb-3 ${iconClass.includes('text-') ? iconClass : iconClass + ' text-amber-400'}`;
        modalIcon.innerHTML = `<i class="fa-solid ${iconClass.split(' ')[0]}"></i>`;
      }
      if (modalTitle) modalTitle.innerText = title;
      if (modalDesc) modalDesc.innerHTML = desc;

      if (actions) {
        actions.innerHTML = "";
        const confirmBtn = document.createElement("button");
        confirmBtn.className = "bg-amber-500 hover:bg-amber-400 text-slate-900 font-black py-3 px-8 rounded-2xl text-sm sm:text-base transition-all shadow-xl active:scale-95";
        confirmBtn.innerText = "確認";
        confirmBtn.onclick = () => {
          modal.classList.add("hidden");
          if (onConfirm) onConfirm();
        };
        actions.appendChild(confirmBtn);

        if (showConfirm) {
          const cancelBtn = document.createElement("button");
          cancelBtn.className = "bg-slate-600 hover:bg-slate-500 text-white font-bold py-3 px-6 rounded-2xl text-sm sm:text-base transition-all shadow active:scale-95";
          cancelBtn.innerText = "取消";
          cancelBtn.onclick = () => {
            modal.classList.add("hidden");
            if (onCancel) onCancel();
          };
          actions.appendChild(cancelBtn);
        }
      }

      modal.classList.remove("hidden");
      animateModalFromElement();
    }

    function animateModalFromElement(elId) {
      const modalCard = document.getElementById("modal-card-main");
      const svgCanvas = document.getElementById("modal-svg-canvas");
      if (!modalCard) return;
      if (svgCanvas) svgCanvas.innerHTML = ""; // Clear old line

      let startX = window.innerWidth / 2;
      let startY = window.innerHeight / 2;
      let startScale = 0.5;
      
      const endX = window.innerWidth / 2;
      const endY = window.innerHeight / 2;

      if (elId) {
        const el = document.getElementById(elId);
        if (el) {
          const rect = el.getBoundingClientRect();
          startX = rect.left + rect.width / 2;
          startY = rect.top + rect.height / 2;
          startScale = 0.1;

          // Draw the connecting line
          if (svgCanvas) {
            const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
            // A simple cubic bezier curve from tile to center
            const cp1x = startX;
            const cp1y = startY + (endY - startY) * 0.5;
            const cp2x = endX;
            const cp2y = startY + (endY - startY) * 0.5;
            
            path.setAttribute("d", `M ${startX} ${startY} C ${cp1x} ${cp1y}, ${cp2x} ${cp2y}, ${endX} ${endY}`);
            path.setAttribute("fill", "transparent");
            path.setAttribute("stroke", "rgba(245, 158, 11, 0.6)"); // amber-500
            path.setAttribute("stroke-width", "4");
            path.setAttribute("stroke-dasharray", "8, 8");
            path.style.animation = "dash 1s linear infinite";
            
            // Add definition for dash animation if not exists
            if (!document.getElementById("dash-anim-style")) {
              const style = document.createElement("style");
              style.id = "dash-anim-style";
              style.innerHTML = `@keyframes dash { to { stroke-dashoffset: -16; } }`;
              document.head.appendChild(style);
            }

            svgCanvas.appendChild(path);

            // Animate line opacity
            path.animate([
              { opacity: 0 },
              { opacity: 1 }
            ], { duration: 700, easing: 'ease-out' });
          }
        }
      }

      const dx = startX - endX;
      const dy = startY - endY;

      modalCard.animate([
        { transform: `translate(${dx}px, ${dy}px) scale(${startScale})`, opacity: 0 },
        { transform: 'translate(0, 0) scale(1)', opacity: 1 }
      ], {
        duration: 700,
        easing: 'cubic-bezier(0.175, 0.885, 0.32, 1.275)'
      });
    }

    function showModalCustomActions(iconClass, title, desc, customHTML) {
      const modal = document.getElementById("modal");
      const target = "main";
      const modalIcon = document.getElementById(`modal-icon-${target}`);
      const modalTitle = document.getElementById(`modal-title-${target}`);
      const modalDesc = document.getElementById(`modal-desc-${target}`);
      const actions = document.getElementById(`modal-actions-${target}`);

      if (modalIcon) {
        modalIcon.className = `text-4xl sm:text-5xl mb-3 ${iconClass.includes('text-') ? iconClass : iconClass + ' text-amber-400'}`;
        modalIcon.innerHTML = `<i class="fa-solid ${iconClass.split(' ')[0]}"></i>`;
      }
      if (modalTitle) modalTitle.innerText = title;
      if (modalDesc) modalDesc.innerHTML = desc;
      if (actions) actions.innerHTML = customHTML;
      modal.classList.remove("hidden");
      animateModalFromElement();
    }

    function addLog(msg, colorClass = "text-slate-300", fromRemote = false) {
      const logBox = document.getElementById("game-log-main");
      if (logBox) {
        const entry = document.createElement("div");
        entry.className = `${colorClass} leading-tight mb-1`;
        entry.innerHTML = `> ${msg}`;
        logBox.appendChild(entry);
        logBox.scrollTop = logBox.scrollHeight;
      }

      // 同步 Log 訊息給遠端
      if (isOnlineMode && peerConn && peerConn.open && !fromRemote) {
        peerConn.send({
          type: 'LOG',
          msg: msg,
          colorClass: colorClass
        });
      }
    }

    function finishTurn() {
      isRolling = false;
      
      // Advance to the next player
      currentPlayerIndex = (currentPlayerIndex + 1) % players.length;

      syncGameStateToPeer();
      updateUI();
    }



    window.openAvatarModal = function(playerIdx) {
      if (isOnlineMode && playerIdx !== myPlayerIndex) {
        addLog("ℹ️ 線上模式下，只能修改自己的角色頭像與暱稱喔！", "text-amber-300 font-bold");
        return;
      }

      editingPlayerIndex = playerIdx;
      const p = players[playerIdx];
      tempAvatarState = {
        name: p.name,
        icon: p.icon,
        color: p.color,
        customAvatar: p.customAvatar,
        avatarType: p.avatarType || 'icon'
      };

      document.getElementById("avatar-input-name").value = tempAvatarState.name;
      document.getElementById("avatar-url-input").value = tempAvatarState.customAvatar || "";
      document.getElementById("avatar-file-input").value = "";

      switchAvatarTab(tempAvatarState.avatarType);
      updateAvatarPreview();

      document.getElementById("avatar-modal").classList.remove("hidden");
    };

    window.closeAvatarModal = function() {
      document.getElementById("avatar-modal").classList.add("hidden");
    };

    window.switchAvatarTab = function(type) {
      tempAvatarState.avatarType = type;
      const btnIcon = document.getElementById("tab-btn-icon");
      const btnImage = document.getElementById("tab-btn-image");
      const tabIcon = document.getElementById("avatar-tab-icon");
      const tabImage = document.getElementById("avatar-tab-image");

      if (type === 'icon') {
        btnIcon.className = "flex-1 py-2 px-3 rounded-xl font-bold text-sm bg-amber-500 text-slate-900 border-2 border-amber-400";
        btnImage.className = "flex-1 py-2 px-3 rounded-xl font-bold text-sm bg-slate-700 text-slate-300 border-2 border-slate-600";
        tabIcon.classList.remove("hidden");
        tabImage.classList.add("hidden");
      } else {
        btnImage.className = "flex-1 py-2 px-3 rounded-xl font-bold text-sm bg-amber-500 text-slate-900 border-2 border-amber-400";
        btnIcon.className = "flex-1 py-2 px-3 rounded-xl font-bold text-sm bg-slate-700 text-slate-300 border-2 border-slate-600";
        tabImage.classList.remove("hidden");
        tabIcon.classList.add("hidden");
      }
      updateAvatarPreview();
    };

    window.selectAvatarIcon = function(icon) {
      tempAvatarState.icon = icon;
      tempAvatarState.avatarType = 'icon';
      updateAvatarPreview();
    };

    window.selectAvatarColor = function(colorClass) {
      tempAvatarState.color = colorClass;
      updateAvatarPreview();
    };

    window.handleAvatarFileUpload = function(e) {
      const file = e.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = function(evt) {
          tempAvatarState.customAvatar = evt.target.result;
          tempAvatarState.avatarType = 'image';
          updateAvatarPreview();
        };
        reader.readAsDataURL(file);
      }
    };

    window.handleAvatarUrlInput = function(e) {
      const url = e.target.value.trim();
      if (url) {
        tempAvatarState.customAvatar = url;
        tempAvatarState.avatarType = 'image';
        updateAvatarPreview();
      }
    };

    window.updateAvatarPreview = function() {
      const previewBox = document.getElementById("avatar-preview-box");
      const previewName = document.getElementById("avatar-preview-name");
      const inputName = document.getElementById("avatar-input-name");

      if (previewName && inputName) {
        previewName.innerText = inputName.value || tempAvatarState.name;
      }

      if (previewBox) {
        previewBox.className = `w-20 h-20 rounded-full ${tempAvatarState.color} flex items-center justify-center text-4xl border-4 border-white shadow-xl overflow-hidden mb-2`;
        
        if (tempAvatarState.avatarType === 'image' && tempAvatarState.customAvatar) {
          previewBox.innerHTML = `<img src="${tempAvatarState.customAvatar}" class="w-full h-full object-cover rounded-full" alt="preview" onerror="this.onerror=null; this.src='https://placehold.co/100x100/1e293b/f59e0b?text=User';">`;
        } else if (tempAvatarState.icon.startsWith('fa-')) {
          previewBox.innerHTML = `<i class="fa-solid ${tempAvatarState.icon} text-white"></i>`;
        } else {
          previewBox.innerHTML = `<span class="text-white font-bold">${tempAvatarState.icon}</span>`;
        }
      }
    };

    window.saveAvatarSettings = function() {
      const inputName = document.getElementById("avatar-input-name").value.trim();
      const p = players[editingPlayerIndex];

      if (inputName) p.name = inputName;
      p.icon = tempAvatarState.icon;
      p.color = tempAvatarState.color;
      p.customAvatar = tempAvatarState.customAvatar;
      p.avatarType = tempAvatarState.avatarType;

      addLog(`🎨 ${p.name} 更新了玩家頭像與設定！`, "text-amber-300 font-bold");
      renderPlayers();
      syncGameStateToPeer();
      updateUI();
      closeAvatarModal();
    };

    // 啟動應用程式
    window.onload = async () => {
      if (window.physicsQuizzesReady) {
        await window.physicsQuizzesReady;
      }
      initBoard();
      openLobbyModal();
    };

    // 方便在 GitHub Pages 或瀏覽器 Console 做冒煙測試。
    window.__getGameState = function() {
      return {
        currentPlayerIndex,
        isRolling,
        isOnlineMode,
        isConnected,
        currentRoomId,
        players: JSON.parse(JSON.stringify(players)),
        boardTiles: JSON.parse(JSON.stringify(boardTiles))
      };
    };
  </script>
