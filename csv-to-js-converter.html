<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSV 轉 JS 題庫轉換器</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
            background-color: #f5f5f5;
        }
        .container {
            background-color: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        h1 {
            color: #333;
            text-align: center;
            margin-bottom: 20px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #555;
        }
        input[type="file"] {
            display: block;
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 5px;
            background-color: #fafafa;
        }
        textarea {
            width: 100%;
            height: 300px;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-family: monospace;
            resize: vertical;
        }
        .btn-group {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }
        button {
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            background-color: #4CAF50;
            color: white;
            font-size: 16px;
            cursor: pointer;
            transition: background-color 0.3s;
        }
        button:hover {
            background-color: #45a049;
        }
        button.secondary {
            background-color: #2196F3;
        }
        button.secondary:hover {
            background-color: #1976D2;
        }
        .instructions {
            background-color: #e9f7ef;
            padding: 15px;
            border-left: 5px solid #27ae60;
            margin-bottom: 20px;
            border-radius: 4px;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>CSV 轉 JS 題庫轉換器</h1>
    
    <div class="instructions">
        <p><strong>使用說明：</strong></p>
        <ol>
            <li>準備您的 CSV 檔案（第一列必須是標題，例如：id, question, optionA, optionB, answer 等）。</li>
            <li>選擇檔案後，系統會自動將其轉換為 JavaScript 陣列格式。</li>
            <li>您可以直接複製程式碼，或是點擊下載將其儲存為 <code>questions.js</code>。</li>
            <li>將下載的 <code>questions.js</code> 引入到您的 HTML 中即可使用。</li>
        </ol>
    </div>

    <div class="form-group">
        <label for="csvFileInput">請選擇 CSV 檔案：</label>
        <input type="file" id="csvFileInput" accept=".csv">
    </div>

    <div class="form-group">
        <label for="jsOutput">轉換結果 (JS 格式)：</label>
        <textarea id="jsOutput" readonly placeholder="轉換後的 JS 程式碼會顯示在這裡..."></textarea>
    </div>

    <div class="btn-group">
        <button id="copyBtn" class="secondary">複製程式碼</button>
        <button id="downloadBtn">下載 questions.js</button>
    </div>
</div>

<script>
    document.getElementById('csvFileInput').addEventListener('change', function(e) {
        const file = e.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = function(e) {
            const text = e.target.result;
            const data = parseCSV(text);
            const jsCode = generateJS(data);
            document.getElementById('jsOutput').value = jsCode;
        };
        reader.readAsText(file);
    });

    function parseCSV(str) {
        const rows = [];
        let currentRow = [];
        let currentCell = '';
        let insideQuotes = false;

        for (let i = 0; i < str.length; i++) {
            const char = str[i];
            const nextChar = str[i + 1];

            if (char === '"') {
                if (insideQuotes && nextChar === '"') {
                    currentCell += '"';
                    i++;
                } else {
                    insideQuotes = !insideQuotes;
                }
            } else if (char === ',' && !insideQuotes) {
                currentRow.push(currentCell.trim());
                currentCell = '';
            } else if (char === '\n' && !insideQuotes) {
                currentRow.push(currentCell.trim());
                rows.push(currentRow);
                currentRow = [];
                currentCell = '';
            } else if (char !== '\r') {
                currentCell += char;
            }
        }
        
        // Push the last row if not empty
        if (currentCell !== '' || currentRow.length > 0) {
            currentRow.push(currentCell.trim());
            rows.push(currentRow);
        }

        // Convert array of arrays to array of objects
        if (rows.length === 0) return [];
        
        const headers = rows[0];
        const result = [];
        
        for (let i = 1; i < rows.length; i++) {
            // Skip empty rows
            if (rows[i].length === 1 && rows[i][0] === '') continue;
            
            const obj = {};
            for (let j = 0; j < headers.length; j++) {
                const header = headers[j];
                let value = rows[i][j] || '';
                
                // Try to parse numbers
                if (!isNaN(value) && value !== '') {
                    value = Number(value);
                }
                
                obj[header] = value;
            }
            result.push(obj);
        }
        
        return result;
    }

    function generateJS(data) {
        let js = 'const questionsData = [\n';
        data.forEach((item, index) => {
            js += '  {\n';
            for (const key in item) {
                const value = item[key];
                if (typeof value === 'number') {
                    js += `    ${key}: ${value},\n`;
                } else {
                    // Escape quotes and newlines in string
                    const escapedValue = String(value)
                        .replace(/\\/g, '\\\\')
                        .replace(/"/g, '\\"')
                        .replace(/\n/g, '\\n');
                    js += `    ${key}: "${escapedValue}",\n`;
                }
            }
            js += '  }' + (index < data.length - 1 ? ',' : '') + '\n';
        });
        js += '];\n\n';
        js += '// 如果是在 ES6 模組中使用，可以加上匯出\n';
        js += '// export default questionsData;';
        
        return js;
    }

    document.getElementById('copyBtn').addEventListener('click', function() {
        const textarea = document.getElementById('jsOutput');
        if (!textarea.value) {
            alert('沒有可複製的內容！請先選擇 CSV 檔案。');
            return;
        }
        
        textarea.select();
        document.execCommand('copy');
        
        const originalText = this.innerText;
        this.innerText = '已複製！';
        setTimeout(() => {
            this.innerText = originalText;
        }, 2000);
    });

    document.getElementById('downloadBtn').addEventListener('click', function() {
        const content = document.getElementById('jsOutput').value;
        if (!content) {
            alert('沒有可下載的內容！請先選擇 CSV 檔案。');
            return;
        }

        const blob = new Blob([content], { type: 'application/javascript;charset=utf-8' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'questions.js';
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
    });
</script>

</body>
</html>
